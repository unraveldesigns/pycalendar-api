[pytest]  
log_cli = true
log_level = DEBUG  
log_format = %(asctime)s %(levelname)s %(message)s  
log_date_format = %Y-%m-%d %H:%M:%S
testpaths = tests
python_files = test_*.py
markers =
    client: Tag les tests du client (deselect with '-m "not client"')
    live: Tag les tests qui appellent l'API réelle, nécessitent PYCALENDAR_APIKEY (deselect with '-m "not live"')
    utils: Tag les tests des utils (deselect with '-m "not utils"')
    dev: Tag les tests des séances de developpement (deselect with '-m "not dev"')
    serial
