# .github/workflows/release.yml
name: Create GitHub Release on tag

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools_scm needs the history and the tags to compute the version
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract changelog for this version
        run: |
          # Exact match on "## [VERSION]" (or "## VERSION"), so that 0.5.2 never matches 0.5.20
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "## [" ver "]") == 1 || $0 == "## " ver || index($0, "## " ver " ") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error file=CHANGELOG.md::No entry found for version ${VERSION}. Add a '## [${VERSION}]' section before tagging."
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Run the offline test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -m "not live"

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
          # The version computed by setuptools_scm must be the tag itself, not a dev version
          ls dist/ | grep -F -- "-${VERSION}" || { echo "::error::Built version does not match tag ${VERSION}"; ls dist/; exit 1; }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          # PEP 440 pre-releases (a, b, rc, dev) are flagged as such on GitHub
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          fail_on_unmatched_files: true
