# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Calendar API
site_url: https://docs.calendar-api.ma
site_author: Marouane FAKIR
repo_name: py-calendar-api
repo_url: https://gitlab.com/ud-labs/py-calendar-api
copyright: Copyright &copy; 2024 - 2026 Unravel Designs
site_description: >-
  Documentation du service Calendar API. Jours fériés et ouvrables du Maroc, prend en considération les fêtes
  religieuses et exceptionnelles. Intégrez le dans vos calendriers, appilcations ou data pipelines pour les data engineers.

theme:
  language: fr
  name: material
  logo: assets/img/logo.webp
  favicon: assets/img/favicon.ico
  icon:
    repo: fontawesome/brands/square-gitlab
    search: fontawesome/solid/magnifying-glass
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - scheme: default
      primary: red
      accent: light green
      toggle:
        icon: fontawesome/regular/sun
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: red
      accent: light green
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

plugins:
  - search
  # - glightbox
  # - offline

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.blocks.caption
#   - pymdownx.arithmatex:
#       generic: true
#   - pymdownx.superfences:
#       custom_fences:
#         - name: mermaid
#           class: mermaid
#           format: !!python/name:pymdownx.superfences.fence_code_format
#   - pymdownx.snippets:
#       auto_append:
#         - includes/abbr.md

# extra_javascript:
#   - assets/js/katex.js
