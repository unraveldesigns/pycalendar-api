# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Calendar API
site_url: https://docs.calendar-api.ma
site_author: Marouane FAKIR
repo_name: py-calendar-api
repo_url: https://gitlab.com/ud-labs/py-calendar-api
copyright: Copyright &copy; 2024 - 2026 Unravel Designs
site_description: >-
  Documentation du service Calendar API. Jours fériés et ouvrables du Maroc, prend en considération les fêtes
  religieuses et exceptionnelles. Intégrez le dans vos calendriers, appilcations ou data pipelines pour les data engineers.

theme:
  language: en
  name: material
  logo: assets/img/logo.webp
  favicon: assets/img/favicon.ico
  icon:
    repo: fontawesome/brands/square-gitlab
    search: fontawesome/solid/magnifying-glass
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - scheme: default
      primary: red
      accent: light green
      toggle:
        icon: fontawesome/regular/sun
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: red
      accent: light green
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

nav:
  - Home: index.md
  - How it Works: how-it-works.md
  - Reference:
    - Response Models: 'reference-docs/models.md'
    - Exceptions: 'reference-docs/exceptions.md'
    - Properties: 'reference-docs/properties.md'
    - Resource Adapters: 'reference-docs/domains.md'
    - Config: 'reference-docs/config.md'
    - Utils: 'reference-docs/utils.md'
  - Changelog: CHANGELOG.md
  - License: LICENSE.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Where to find your sources, see "Finding modules".
          paths: [pycalendar_api]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            # DOCSTRINGS ----------------------------------------
            docstring_options:
              # Discard first line of `__init__` method docstrings,
              # useful when merging such docstrings into their parent class'.
              ignore_init_summary: true
            # Tables are generally too large, lists will fix this.
            docstring_section_style: list
            # Enable cross-references in signatures.
            signature_crossrefs: true
            # Unwrap actual types from `Annotated` type annotations.
            unwrap_annotated: true
            # Show class inherited members.
            inherited_members: true
            # Render auto-generated summaries of attributes, functions, etc.
            # at the start of each symbol's documentation.
            summary: true

            # HEADINGS ------------------------------------------
            # For auto-generated pages, one module per page,
            # make the module heading be the H1 heading of the page.
            heading_level: 2
            # Render headings for parameters, making them linkable.
            parameter_headings: true
            # Render headings for type parameters too.
            type_parameter_headings: true
            # Always show the heading for the symbol you render with `::: id`.
            show_root_heading: true
            # Only show the name of the symbols you inject render `::: id`.
            show_root_full_path: false
            # Show the type of symbol (class, function, etc.) in the heading.
            show_symbol_type_heading: true
            # Show the type of symbol (class, function, etc.) in the table of contents.
            show_symbol_type_toc: true

            # Merge signature and docstring of `__init__` methods
            # into their parent class signature and docstring.
            merge_init_into_class: true
            # Render signatures and attribute values in a separate code block,
            # below the symbol heading.
            separate_signature: true
            # Show type annotations in signatures.
            show_signature_annotations: true
            # Show type parameters in signatures.
            show_signature_type_parameters: true
            # Show base classes OR inheritance diagram.
            show_bases: false


  # - glightbox
  # - offline

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.blocks.caption
#   - pymdownx.snippets:
#       auto_append:
#         - includes/abbr.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/marouane-fakir-98911b72
      name: Marouane FAKIR
