extra:
  # Enlève generated by mkDocs
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/marouane-fakir-98911b72
      name: Developper Profile

# watch:
#   - docs/

nav:
  - Home: index.md
