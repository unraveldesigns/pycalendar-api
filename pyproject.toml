[project]
name = "pycalendar_api"
requires-python = ">=3.12.0"
readme = "README.md"
version = "1.0.0"
# dynamic = ["version"]
description = "Client de Calendar API"
keywords = ["SETUPTOOLS", "CALENDAR-API", "API", "CALENDAR", "MOROCCO"]
authors = [
  {name = "Unravel Designs", email = "ud@unraveldesigns.ma"},
]
maintainers = [
  {name = "Marouane FAKIR", email = "mfakir@unraveldesigns.ma"},
  {name = "Unravel Designs", email = "ud@unraveldesigns.ma"},
]

classifiers = [
  # Indicate who your project is intended for
  "Intended Audience :: Developpers :: Morocco :: UnravelDesigns",
  "Topic :: Software Development :: API Client",
  # Pick your license as you wish
  "License :: MIT",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  'httpx',
  'httpx[cli]',
  'more_itertools',
  'pyparsing',
  'python-dateutil',
  'sortedcollections',
  'sortedcontainers',
  'tomlkit',
]

[build-system]
# requires = ["setuptools>=69.0.3", "wheel", "setuptools_scm>=8"]
requires = ["setuptools>=69.0.3", "wheel"]

# [tool.setuptools_scm]
# write_to = "flint/__version__.py"

[tool.setuptools]
packages = ["pycalendar_api"]
include-package-data = true

# [tool.setuptools.packages.find]
# include = ["flint*"]
# exclude = ["flint*testing*", "flint*test*"]
# namespaces = false

[project.optional-dependencies]
dev = [
  "ptpython",
  "pyinstrument",
  "python-lsp-server[all]",
]
test = [
  "pytest",
  "pytest-sugar",
]
docs = [
  'mkdocs',
  'mkdocs-material',
  'pymdown-extensions',
]

[project.urls]
"API-Spec" = "https://atlas-market.ma/documentation"
"Homepage" = "https://gitlab.com/ud-labs/py-calendar-api"
"Bug Reports" = "https://gitlab.com/ud-labs/py-calendar-api"
"Source" = "https://gitlab.com/ud-labs/py-calendar-api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "E",
  "F",
  "G",
  "I",
  "LOG",
  "N",
  "NPY",
  "PT",
  "Q",
  "SIM",
  "UP",
  "W",
]
ignore = ["C401", "E111", "E114", "E117", "E501", "B904", "Q000", "Q001", "Q002", "Q003", "UP007", "G004"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true
preview = true
