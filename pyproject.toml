[project]
name = "pycalendar_api"
requires-python = ">=3.12.0"
readme = "README.md"
# version = "1.0.0"
dynamic = ["version"]
description = "Python client of Calendar API"
dependencies = [
  'niquests[speedups]',
  'python-dateutil',
  'sortedcontainers',
  'tomlkit',
]
keywords = ["CALENDAR API", "API CLIENT", "CALENDAR", "HOLIDAYS", "MOROCCO"]
authors = [
  {name = "Marouane FAKIR", email = "mfakir@unraveldesigns.ma"},
  {name = "Unravel Designs", email = "ud@unraveldesigns.ma"},
]
maintainers = [
  {name = "Marouane FAKIR", email = "mfakir@unraveldesigns.ma"},
  {name = "Unravel Designs", email = "ud@unraveldesigns.ma"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel", "setuptools_scm>=8"]

[tool.setuptools_scm]
write_to = "pycalendar_api/__version__.py"

[tool.setuptools]
packages = ["pycalendar_api"]
include-package-data = true

[project.optional-dependencies]
dev = [
  "build",
  "twine",
  "ptpython",
  "pyinstrument",
  "python-lsp-server[all]",
  "ruff>=0.14.8",
  "mkdocs<2.0.0",
  "mkdocs-material[imaging]<=9.8.0",
  "pymdown-extensions",
  "mkdocs-gen-files",
  "mkdocs-git-revision-date-localized-plugin",
  "mkdocs-literate-nav",
  "mkdocs-minify-plugin",
  "mkdocstrings[python]",
  "pytest",
  "pytest-sugar",
]

[project.urls]
"Homepage" = "https://calendar-api.ma"
"Documentation" = "https://docs.calendar-api.ma"
"API-Spec" = "https://calendar-api.ma/api/v1/docs"
"Bug Reports" = "https://gitlab.com/ud-labs/py-calendar-api"
"Source" = "https://gitlab.com/ud-labs/py-calendar-api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "A", "B", "C4", "E", "F", "G", "I", "LOG",
  "N", "NPY", "PT", "Q", "SIM", "UP", "W",
]
ignore = ["C401", "E111", "E114", "E117", "E501", "B904", "Q000", "Q001", "Q002", "Q003", "UP007", "G004"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true
preview = true
