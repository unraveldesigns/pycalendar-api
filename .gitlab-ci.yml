image: python:3.12-slim-bullseye

default:
  tags:
    - saas-linux-medium-amd64

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "ci"

stages:
  - test
  - build
  - publish

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # PIP_NO_CACHE_DIR: "1"

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: test

# ====== Test ========
test-job:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --upgrade pip
    - pip install -e .[dev]
    - pytest -vv
  rules:
    - if: $CI_COMMIT_TAG

# ====== Build ========
build-job:
  stage: build
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --upgrade pip
    - pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG

# ====== Gitlab Package Registry ========
publish-gitlab:
  stage: publish
  needs:
    - build-job
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  script:
    - pip install twine
    - twine upload --verbose --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - if: $CI_COMMIT_TAG

# ====== PyPI ========
publish-pypi:
  stage: publish
  needs:
    - build-job
  environment:
    name: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install twine
    - twine upload --verbose dist/*
  rules:
    - if: $CI_COMMIT_TAG

# ====== Pages / Docs ========
pages:
  stage: publish
  needs: []
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - pip install --upgrade pip
    - pip install -e .[dev]
    - mkdocs build --verbose --site-dir public
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
